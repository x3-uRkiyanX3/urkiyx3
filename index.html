<!DOCTYPE html>
<html lang="ja">
    <head>
        <title>音楽MBTI診断サイト</title>
        <meta charset="UTF-8">
        <meta name="description" content="音楽MBTI診断サイト" >
        <link rel="stylesheet" href="theme.css">
    </head>
    <body>
        <div class="main_content">
            <p id="site_title_text">音楽MBTI診断</p>
            <p id="site_subtitle_text">TobuCP Music MBTI</p>
        </div>
        <div class="mbti_test_content">
            <div class="mbti_test_content1">
                <p id="test_1_text">新しいアーティストを見つけるなら...</p>
                <input type="radio" name="mbti_test_content1_button" id="mbti_test_content1_button_E" value="E">
                <label for="mbti_test_content1_button_E">おすすめ・SNS・友達からどんどん開拓する</label>
                <input type="radio" name="mbti_test_content1_button" id="mbti_test_content1_button_I" value="I">
                <label for="mbti_test_content1_button_I">好きなアーティストをずっと聴いていたい</label>
            </div>
            <div class="mbti_test_content2">
                <p id="test_2_text">ライブ当日は...</p>
                <input type="radio" name="mbti_test_content2_button" id="mbti_test_content2_button_P" value="P">
                <label for="mbti_test_content2_button_P">当日の雰囲気で楽しみたい！</label>
                <input type="radio" name="mbti_test_content2_button" id="mbti_test_content2_button_J" value="J">
                <label for="mbti_test_content2_button_J">セトリ予想や持ち物を事前に準備する</label>
            </div>
            <div class="mbti_test_content3">
                <p id="test_3_text">歌詞を聴くときは...</p>
                <input type="radio" name="mbti_test_content3_button" id="mbti_test_content3_button_N" value="N">
                <label for="mbti_test_content3_button_N">この人は何を伝えたいんだろう</label>
                <input type="radio" name="mbti_test_content3_button" id="mbti_test_content3_button_S" value="S">
                <label for="mbti_test_content3_button_S">メロディや演奏かっこいい！</label>
            </div>
            <div class="mbti_test_content4">
                <p id="test_4_text">好きな曲を見つけると...</p>
                <input type="radio" name="mbti_test_content4_button" id="mbti_test_content4_button_E" value="E">
                <label for="mbti_test_content4_button_E">すぐ友達に布教する</label>
                <input type="radio" name="mbti_test_content4_button" id="mbti_test_content4_button_I" value="I">
                <label for="mbti_test_content4_button_I">自分だけでじっくり楽しみたい</label>
            </div>
            <div class="mbti_test_content5">
                <p id="test_5_text">プレイリストは...</p>
                <input type="radio" name="mbti_test_content5_button" id="mbti_test_content5_button_P" value="P">
                <label for="mbti_test_content5_button_P">気分で毎回変える</label>
                <input type="radio" name="mbti_test_content5_button" id="mbti_test_content5_button_J" value="J">
                <label for="mbti_test_content5_button_J">テーマごとに整理している</label>
            </div>
            <div class="mbti_test_content6">
                <p id="test_6_text">楽器を始めるなら...</p>
                <input type="radio" name="mbti_test_content6_button" id="mbti_test_content6_button_P" value="P">
                <label for="mbti_test_content6_button_P">とりあえず好きな曲から挑戦！</label>
                <input type="radio" name="mbti_test_content6_button" id="mbti_test_content6_button_J" value="J">
                <label for="mbti_test_content6_button_J">基礎練習から始めたい</label>
            </div>
            </div>
            <div class="mbti_test_content7">
                <p id="test_7_text">一番惹かれるのは？</p>
                <input type="radio" name="mbti_test_content7_button" id="mbti_test_content7_button_N" value="N">
                <label for="mbti_test_content7_button_N">この曲、情景が浮かぶ</label>
                <input type="radio" name="mbti_test_content7_button" id="mbti_test_content7_button_S" value="S">
                <label for="mbti_test_content7_button_S">演奏技術すご！</label>
            </div>
            </div>
            <div class="mbti_test_content8">
                <p id="test_8_text">ライブ中は...</p>
                <input type="radio" name="mbti_test_content8_button" id="mbti_test_content8_button_E" value="E">
                <label for="mbti_test_content8_button_E">周りと一緒に盛り上がる！</label>
                <input type="radio" name="mbti_test_content8_button" id="mbti_test_content8_button_I" value="I">
                <label for="mbti_test_content8_button_I">演奏や歌をじっくり味わう</label>
            </div>
            </div>
            <div class="mbti_test_content9">
                <p id="test_9_text">好きな曲を100回聴いても...</p>
                <input type="radio" name="mbti_test_content9_button" id="mbti_test_content9_button_N" value="N">
                <label for="mbti_test_content9_button_N">新しい解釈や発見がある</label>
                <input type="radio" name="mbti_test_content9_button" id="mbti_test_content9_button_S" value="S">
                <label for="mbti_test_content9_button_S">演奏の細かい違いが気になる</label>
            </div>
            </div>
            <div class="mbti_test_content10">
                <p id="test_10_text">音楽は...</p>
                <input type="radio" name="mbti_test_content10_button" id="mbti_test_content10_button_F" value="F">
                <label for="mbti_test_content10_button_F">人生を彩るもの</label>
                <input type="radio" name="mbti_test_content10_button" id="mbti_test_content10_button_T" value="T">
                <label for="mbti_test_content10_button_T">人生を支えるもの</label>
            </div>
            <button id="view_result" onclick="getAnswers()">結果を見る</button>
        </div>
        <script src="script.js"></script>
    </body>
</html>
